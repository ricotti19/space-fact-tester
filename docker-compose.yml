version: "3.8"

services:
  db:
    image: postgres:15
    container_name: space_quiz_db
    restart: always
    
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-quiz_user}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: ${LOCAL_DB_NAME:-space_quiz}

    ports:
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: