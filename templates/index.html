<!DOCTYPE html>
<html>
<head>
    <title>NASA Space Quiz</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', Arial, sans-serif, fantasy;
            color: #190770;
            
            /* Background configuration for base layer */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            background-color: #020215; /* Dark fallback */
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: 0; /* Keep it behind text content */
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smoothly crossfades opacity */
        }

        .card {
            position: relative;
            z-index: 1; /* Pushes card above the transition layers */
            width: 1000px;
            padding: 30px;
            border-radius: 18px;

            background: rgba(3, 8, 87, 0.75); /* blend well with blurred images */
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 0 40px rgba(0, 200, 255, 0.15),
                0 0 120px rgba(0, 100, 255, 0.1);

            color: white;
            text-align: center;
            border: 1px solid rgba(0, 200, 255, 0.2);
        }

        h2 {
            margin: 0;
            font-size: 50px;
            letter-spacing: 1px;
            color: white;
        }

        /* Dynamic HUD Row Layout */
        .hud-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0.9;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }
        
        #question {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.4;
        }

        .options button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid rgba(125, 211, 252, 0.25);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 24px;
        }

        .options button:hover {
            background: rgba(125, 211, 252, 0.25);
            transform: scale(1.03);
            box-shadow: 0 0 12px rgba(125, 211, 252, 0.3);
        }

        #result {
            margin-top: 1px;
            font-weight: bold;
            height: 20px;
        }

        .correct {
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .wrong {
            color: #fb7185;
            text-shadow: 0 0 10px rgba(251, 113, 133, 0.5);
        }

        .header {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="bg-overlay" class="overlay"></div>

<div class="card">
    <div class="header">
        <h2>🚀 NASA MISSION QUIZ 🪐</h2>
    </div>
    
    <div class="hud-container">
        <div>Score: <span id="score-display" style="color: #00ffcc;">0</span></div>
        <div>Difficulty Level: <span id="difficulty-display" style="color: #ffcc00;">1</span></div>
    </div>

    <div id="question">Loading mission data...</div>
    <div class="options" id="options"></div>
    <div id="result"></div>
</div>

<script>
let currentQuestionId = null;
let currentScore = 0; // Tracks arcade session score across rounds

// 1. ADVANCED CROSSFADE BACKGROUND ENGINE
const backgrounds = [
    '/static/bg.jpg',
    '/static/bgasteroids.jpg',
    '/static/milkyway.jpg',
    '/static/nebula.jpg',
    '/static/surface.jpg'
];

let currentBgIndex = 0;

function rotateBackground() {
    const overlay = document.getElementById("bg-overlay");
    const nextBgIndex = (currentBgIndex + 1) % backgrounds.length;
    
    // Set next image onto hidden overlay pane
    overlay.style.backgroundImage = `url('${backgrounds[nextBgIndex]}')`;
    overlay.style.opacity = "1"; // Fade overlay in smoothly over the body

    // Wait until transition completes (1.5s), then equalize the base body layer
    setTimeout(() => {
        document.body.style.backgroundImage = `url('${backgrounds[nextBgIndex]}')`;
        overlay.style.opacity = "0"; // Instantly hide overlay layer until next rotation cycle
        currentBgIndex = nextBgIndex;
    }, 1500); 
}

document.addEventListener("DOMContentLoaded", () => {
    document.body.style.backgroundImage = `url('${backgrounds[0]}')`;
    setInterval(rotateBackground, 5000); // Transitions seamlessly every 5 seconds
});


// 2. QUIZ API LOGIC
async function start() {
    const res = await fetch("/start");
    const data = await res.json();
    render(data);
}

function render(data) {
    currentQuestionId = data.question_id;

    document.getElementById("question").innerText = data.question;
    
    // Synchronize UI HUD strings smoothly
    document.getElementById("difficulty-display").innerText = data.difficulty;
    document.getElementById("score-display").innerText = currentScore;

    const box = document.getElementById("options");
    box.innerHTML = "";

    data.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => submit(opt);
        box.appendChild(btn);
    });

    document.getElementById("result").innerText = "";
    document.getElementById("result").className = "";
}

async function submit(answer) {
    const res = await fetch("/answer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            question_id: currentQuestionId,
            answer: answer
        })
    });

    const data = await res.json();
    const result = document.getElementById("result");

    if (data.correct) {
        result.innerText = "✔ Mission Success";
        result.className = "correct";
        currentScore += 10; // Increments arcade tracker on successful validation
    } else {
        result.innerText = "✖ Mission Failed";
        result.className = "wrong";
        currentScore = Math.max(0, currentScore - 5); // Protects index from dropping into negative limits
    }

    // Instantly update HUD score value so it reacts before the next question loads
    document.getElementById("score-display").innerText = currentScore;

    setTimeout(() => {
        render(data.next_question);
    }, 700);
}

start();
</script>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
